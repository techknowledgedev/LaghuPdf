name: Release Desktop App

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @pdftwist/web build

      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @pdftwist/desktop build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm --filter @pdftwist/desktop build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false  # Set up code signing separately

      - name: Build Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @pdftwist/desktop build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdftwist-desktop-${{ matrix.os }}
          path: apps/desktop/release/**/*
          retention-days: 30
